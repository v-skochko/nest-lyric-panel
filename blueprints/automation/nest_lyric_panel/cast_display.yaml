blueprint:
  name: Nest Lyric Panel - automatic Cast
  description: >-
    Display an existing dashboard view on a Google Cast screen while a selected
    media player is playing. Restore the display if it leaves the selected view.
    Casting can interrupt whatever else is on the screen.
  domain: automation
  input:
    source_player:
      name: Media player to monitor
      selector:
        entity:
          domain: media_player
    display:
      name: Nest Hub or Google Cast display
      selector:
        entity:
          domain: media_player
    dashboard_path:
      name: Dashboard path
      default: lovelace
      selector:
        text:
    view_path:
      name: View path
      default: nest-hub
      selector:
        text:
    view_title:
      name: View title as shown by Cast
      description: Used to avoid recasting an already active view.
      default: Nest Hub
      selector:
        text:

mode: single
variables:
  source_player: !input source_player
  display: !input display
  view_title: !input view_title
triggers:
  - trigger: state
    entity_id: !input source_player
    to: playing
  - trigger: state
    entity_id: !input display
    to: idle
    for: "00:00:20"
  - trigger: state
    entity_id: !input display
    to: "off"
    for: "00:00:20"
  - trigger: time_pattern
    minutes: "/2"
conditions:
  - condition: template
    value_template: "{{ is_state(source_player, 'playing') }}"
  - condition: template
    value_template: >-
      {{ not (is_state(display, 'playing')
        and state_attr(display, 'app_id') == 'A078F6B0'
        and (state_attr(display, 'media_title') | default('', true)).endswith(': ' ~ view_title)) }}
actions:
  - variables:
      was_muted: "{{ state_attr(display, 'is_volume_muted') }}"
  - if:
      - condition: template
        value_template: "{{ was_muted == false }}"
    then:
      - action: media_player.volume_mute
        target:
          entity_id: !input display
        data:
          is_volume_muted: true
        continue_on_error: true
      - wait_template: "{{ state_attr(display, 'is_volume_muted') == true }}"
        timeout: "00:00:03"
        continue_on_timeout: true
  - action: cast.show_lovelace_view
    data:
      entity_id: !input display
      dashboard_path: !input dashboard_path
      view_path: !input view_path
    continue_on_error: true
  - delay: "00:00:03"
  - if:
      - condition: template
        value_template: "{{ was_muted == false and state_attr(display, 'is_volume_muted') == true }}"
    then:
      - action: media_player.volume_mute
        target:
          entity_id: !input display
        data:
          is_volume_muted: false
        continue_on_error: true
