<!doctype html><meta charset="utf-8"><pre id="result">waiting</pre>
<script type="module">
import '../custom_components/nest_lyric_panel/frontend/nest-lyric-display.js';
const host=document.createElement('div');host.style.width='400px';document.body.append(host);
