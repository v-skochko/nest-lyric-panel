<!doctype html>
<meta charset="utf-8">
<style>body { margin: 0 } nest-lyric-display { display:block; height:550px; }</style>
<nest-lyric-display></nest-lyric-display>
<pre id="result">waiting</pre>
<script type="module">
import "../custom_components/nest_lyric_panel/frontend/nest-lyric-display.js";
const card=document.querySelector('nest-lyric-display');
const calls=[];
const attrs=(artist,title)=>({media_title:title,media_artist:artist,media_duration:100,media_position:25,media_position_updated_at:new Date().toISOString(),supported_features:8322623});
const h={
  language:'en',
  states:{
    'input_select.test_room':{state:'Room A'},
    'input_select.test_source':{state:'Music'},
    'media_player.a_ma':{state:'playing',attributes:attrs('Artist A','Track A')},
    'media_player.a_speaker':{state:'playing',attributes:attrs('Artist Cast','Track Cast')},
    'media_player.a_cast':{state:'idle',attributes:{}},
    'media_player.b_ma':{state:'playing',attributes:attrs('Artist B','Track B')},
    'media_player.b_speaker':{state:'playing',attributes:attrs('Artist B Cast','Track B Cast')},
    'media_player.b_cast':{state:'idle',attributes:{}}
  },
  callService:async(domain,service,data)=>calls.push({domain,service,data}),
  callWS:async(msg)=>msg.type.endsWith('/lookup')?{status:'found',syncedLyrics:'[00:00.00]First original\n[00:20.00]Second original',duration:100}:msg.type.endsWith('/mode')?1:{status:'ok',translatedText:msg.text.map(()=> 'Переклад')},
  hassUrl:p=>p
};
h.states['sensor.main_zone']={state:'showing',attributes:{active_player:'media_player.a_ma',control_player:'media_player.a_speaker'}};
card.setConfig({zone_entity:'sensor.main_zone',lyrics:{sync_offset:1}});
card.hass=h;
await new Promise(r=>setTimeout(r,150));
const results={initialPlayer:card.player,initialTitle:card.shadowRoot.querySelector('.name-box.song .name-text').textContent,lyricTag:card.lyric.tagName,lyricOffset:card.lyric.config.sync_offset};
card.shadowRoot.querySelector('[data-command="media_next_track"]').click();
h.states['sensor.main_zone'].attributes={active_player:'media_player.b_ma',control_player:'media_player.b_speaker'};card.hass=h;
results.roomPlayer=card.player;
h.states['media_player.b_cast']={state:'playing',attributes:{...attrs('Artist B Cast','Track B Cast'),media_position:40,app_name:'YouTube Music'}};h.states['sensor.main_zone'].attributes.active_player='media_player.b_cast';card.hass=h;
results.youtubePlayer=card.player;results.youtubeTimeline=card.timelinePlayer;results.youtubeLyricEntity=card.lyric.config.entity;results.youtubeElapsed=card.shadowRoot.querySelector('.elapsed').textContent;results.youtubeTitle=card.shadowRoot.querySelector('.name-box.song .name-text').textContent;
card.shadowRoot.querySelector('[data-command="volume_up"]').click();
card.shadowRoot.querySelector('[data-command="media_play_pause"]').click();
card.shadowRoot.querySelector('[data-command="media_next_track"]').click();
const bar=card.shadowRoot.querySelector('.progress-track');bar.click();bar.dispatchEvent(new Event('change'));
const buttons=[...card.shadowRoot.querySelectorAll('.controls button')];
const controls=card.shadowRoot.querySelector('.controls').getBoundingClientRect(),first=buttons[0].getBoundingClientRect(),last=buttons[4].getBoundingClientRect();
results.buttonOrder=buttons.map(b=>b.dataset.command);
results.centerDelta=Math.abs((first.left+last.right)/2-(controls.left+controls.right)/2);
results.playWidth=buttons[2].getBoundingClientRect().width;results.otherWidth=buttons[0].getBoundingClientRect().width;
results.playColor=getComputedStyle(buttons[2]).backgroundColor;results.volumeColors=[getComputedStyle(buttons[0]).backgroundColor,getComputedStyle(buttons[4]).backgroundColor];
results.elapsed=card.shadowRoot.querySelector('.elapsed').textContent;results.duration=card.shadowRoot.querySelector('.duration').textContent;
results.progressRole=bar.getAttribute('role');results.progressValue=bar.getAttribute('aria-valuenow');results.progressFocusable=bar.hasAttribute('tabindex');results.sliderCount=card.shadowRoot.querySelectorAll('input[type="range"]').length;
const artwork=card.shadowRoot.querySelector('.art').getBoundingClientRect(),progress=bar.getBoundingClientRect();
results.progressGap=progress.top-artwork.bottom;
await new Promise(r=>setTimeout(r,100));const invalid=h.states['media_player.b_cast'].attributes;delete invalid.media_position;card.hass=h;results.unknownActive=!!card.lyric.shadowRoot.querySelector('.line.active');
results.unknownElapsed=card.shadowRoot.querySelector('.elapsed').textContent;
results.unknownValue=bar.getAttribute('aria-valuenow');
h.states['media_player.b_cast'].attributes.media_title='Track Changed';h.states['media_player.b_cast'].attributes.media_content_id='new-track';h.states['media_player.b_cast'].attributes.media_position=5;card.hass=h;results.newTrackTitle=card.shadowRoot.querySelector('.name-box.song .name-text').textContent;results.newTrackElapsed=card.shadowRoot.querySelector('.elapsed').textContent;
h.states['media_player.b_cast'].state='paused';h.states['media_player.b_cast'].attributes.media_position=45;card.hass=h;results.pausedElapsed=card.shadowRoot.querySelector('.elapsed').textContent;results.pausedTimeline=card.timelinePlayer;
h.states['media_player.b_cast']={state:'idle',attributes:{}};h.states['sensor.main_zone'].attributes.active_player='media_player.b_ma';card.hass=h;results.backToMusic=card.timelinePlayer;
results.calls=calls;results.width=innerWidth;results.displayWidth=card.getBoundingClientRect().width;
const zoned=document.createElement('nest-lyric-display');document.body.append(zoned);zoned.setConfig({zone_entity:'sensor.cast_zone'});zoned.hass={...h,states:{...h.states,'sensor.cast_zone':{state:'showing',attributes:{active_player:'media_player.a_ma'}}}};results.zonePlayer=zoned.player;
const ytZone=document.createElement('nest-lyric-display');document.body.append(ytZone);ytZone.setConfig({zone_entity:'sensor.yt_zone'});ytZone.hass={...h,states:{...h.states,'sensor.yt_zone':{state:'showing',attributes:{active_player:'media_player.b_cast',control_player:'media_player.b_speaker'}},'media_player.b_cast':{state:'playing',attributes:{...attrs('Artist','Track'),app_name:'YouTube Music'}}}};results.zoneYoutubeControl=ytZone.player;results.zoneYoutubeTimeline=ytZone.timelinePlayer;
const single=document.createElement('nest-lyric-display');document.body.append(single);single.setConfig({entity:'media_player.a_ma'});single.hass=h;results.singlePlayer=single.player;
document.querySelector('#result').textContent=JSON.stringify(results);
</script>
